services:
  db:
    image: postgres:15
    container_name: rh_master_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rh_master
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  backend:
    build: ./backend
    container_name: rh_master_backend
    restart: always
    depends_on:
      - db
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: rh_master
      DB_SSL: false
      JWT_SECRET: supersecretkey123
      JWT_EXPIRES_IN: 1d
      UPLOADS_DIR: uploads
    volumes:
      - ./backend:/app:cached
      # ⚠ Não mapear node_modules do host
    command: sh -c "npm install && npm run dev"

  db-init:
    image: postgres:15
    container_name: rh_master_db_init
    depends_on:
      - db
    # run a hosted script (ensures proper LF endings and avoids compose multiline parsing problems)
    entrypoint: ["/bin/sh","/docker-entrypoint-initdb.d/init-db.sh"]
    volumes:
      - ./db/init.sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./db/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    restart: "no"

  frontend:
    build: ./frontend
    container_name: rh_master_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://backend:3000   # usa o nome do serviço do docker
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev"

volumes:
  postgres_data:
